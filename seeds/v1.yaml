goal: Build helios v1 as a Go HTTP durable orchestrator that accepts suspicious transaction
  signals, stores cases in SQLite, runs lumoskit as a child process, classifies outcomes
  from summary.json, fans out successful results, notifies operators, and exposes
  operator APIs for case search and handoff retry
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- Single-process v1 deployment
- Go service built on the standard library net/http; a lightweight router (chi or gorilla mux) is permitted but heavy frameworks (gin, echo, fiber) are out of scope
- SQLite durable state store
- Docker container with persistent volume for SQLite DB and output roots
- No external queue, Postgres, Redis, SQS, RabbitMQ, Kafka, polling ingress, CLI ingest, serverless, multi-instance, distributed locking, dashboard UI, SSE, WebSocket, or OpenTelemetry in v1
- Must invoke lumoskit only as child process with --tx, --chain, --output-root
- Must use caller-unique output root for every lumoskit attempt
- Must read summary.json from chosen output root, including failure paths
- RPC env vars are passed through unchanged to the spawned lumoskit child process; lumoskit owns RPC resolution per ADR-0018 and helios performs no RPC selection logic
- Submission ingress is limited to POST /signals and POST /cases; operator endpoints (GET /cases, GET /cases/{case_id}, POST /cases/{case_id}/retry-handoff), /healthz, and /metrics are separate API surfaces and not considered submission ingress
- All HTTP endpoints (submission, operator, /metrics) are protected by one shared Bearer token from HELIOS_API_TOKEN; /healthz is unauthenticated for container probe compatibility
- Dedup key is (chain, tx_hash)
- Dedup lookup returns the latest lineage leaf (highest attempt_number) for the dedup key; status=existing when the leaf state is one of queued, running, done, or handed-off; status=rerun_created when the leaf state is failed; status=new when no prior lineage exists for the dedup key
- force_rerun is manual submit only and never aborts a currently running lumoskit attempt; it queues a new linked case-per-attempt that runs once max_concurrent_lumoskit permits and both attempts record their outcomes independently
- Lineage model is case-per-attempt; each retry, automatic engine_error recovery, or force_rerun creates a new case row linked to its predecessor by parent_case_id, and attempt_number increments along the lineage chain
- New cases are inserted directly at state=queued in the same SQLite transaction as their submission; the state machine has no received state
- Queue is SQLite-backed internal FIFO ordered by created_at ASC
- max_concurrent_lumoskit defaults to 2 and is configurable via env HELIOS_MAX_CONCURRENT_LUMOSKIT
- Handoff retry policy is bounded exponential backoff governed by env HELIOS_HANDOFF_RETRY_MAX_ATTEMPTS (default 5), HELIOS_HANDOFF_RETRY_BACKOFF_BASE_SECONDS (default 2), and HELIOS_HANDOFF_RETRY_BACKOFF_MAX_SECONDS (default 300)
- Notification retry policy is bounded exponential backoff governed by env HELIOS_NOTIFY_RETRY_MAX_ATTEMPTS (default 5), HELIOS_NOTIFY_RETRY_BACKOFF_BASE_SECONDS (default 2), and HELIOS_NOTIFY_RETRY_BACKOFF_MAX_SECONDS (default 300)
- Restart recovery is a single startup rule; every case found in state=running is updated to state=failed with outcome=engine_error and failure_kind=host_restart, and then a new linked case is inserted as state=queued with attempt_number+1, parent_case_id set to the predecessor case_id, and a fresh output_root
- State machine is hand-rolled in Go and every state transition is written inside the same SQLite transaction as the matching case_events row
- State tracks operational progress only; outcome tracks lumoskit quality result only; state=failed is reserved for engine failures and never used for handoff or notification failures
- Downstream fan-out is configured direct HTTP webhooks only, loaded at startup from comma-separated env HELIOS_DOWNSTREAM_WEBHOOK_URLS
- engine_error cases set handoff_status=skipped in the same SQLite transaction that sets state=failed; no downstream URL is attempted for engine_error
- handoff_status aggregation across configured downstream URLs is normative; handoff_status=succeeded if and only if every URL in HELIOS_DOWNSTREAM_WEBHOOK_URLS has at least one successful delivery; handoff_status=retrying while any URL remains within its retry budget; handoff_status=failed as soon as any single URL exhausts its retry budget; handoff_status=skipped when HELIOS_DOWNSTREAM_WEBHOOK_URLS is empty (state advances directly to handed-off on the same SQLite transaction that sets state=done) or when state=failed with outcome=engine_error
- engine_error cases are not sent downstream; they only produce operator notifications
- Operator notifications support exactly two native channels in v1; HTTP webhook (env OPERATOR_NOTIFY_WEBHOOK_URL) and Telegram bot (env TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID); each channel is enabled if and only if its env vars are set
- Slack, Discord, and email native integrations are excluded from v1 and must be wired through OPERATOR_NOTIFY_WEBHOOK_URL by the operator
- Notification failure never changes case state and never blocks downstream fan-out
- The outcome mapping below is normative; helios must produce exactly these state/outcome/failure_kind triples after each lumoskit child process exits, evaluated strictly in the order O5, O6, O7, O4, O1, O2, O3, O8 (first matching rule wins)
- Outcome mapping rule O5; exit code non-zero (summary.json contents are ignored) maps to state=failed, outcome=engine_error, failure_kind=lumoskit_nonzero_exit
- Outcome mapping rule O6; summary.json missing at expected path maps to state=failed, outcome=engine_error, failure_kind=summary_missing
- Outcome mapping rule O7; summary.json present but JSON parse fails maps to state=failed, outcome=engine_error, failure_kind=summary_unreadable
- Outcome mapping rule O4; exit code 0 with summary.json present and parseable and summary.failure.kind set maps to state=failed, outcome=engine_error, failure_kind=lumoskit_reported_engine_error
- Outcome mapping rule O1; exit code 0 with summary.json present and parseable and summary.status=pass and summary.poc.status=verified and summary.failure absent maps to state=done, outcome=verified, failure_kind=null
- Outcome mapping rule O2; exit code 0 with summary.json present and parseable and summary.status=partial and summary.failure absent maps to state=done, outcome=partial, failure_kind=null
- Outcome mapping rule O3; exit code 0 with summary.json present and parseable and summary.status=fail and summary.poc.status in unverified or missing and summary.failure absent maps to state=done, outcome=unverified, failure_kind=null
- Outcome mapping rule O8 (catch-all); exit code 0 with summary.json present and parseable but matching none of O1, O2, O3, O4 maps to state=failed, outcome=engine_error, failure_kind=lumoskit_unexpected_summary_shape
acceptance_criteria:
- POST /signals accepts JSON body matching submission_request schema and returns HTTP 202 with JSON response matching submission_response schema; status field is response-only and not persisted on any case row
- POST /cases accepts JSON body matching submission_request schema with optional force_rerun boolean and returns HTTP 202 with JSON response matching submission_response schema
- POST /signals and POST /cases return HTTP 400 with body { error_code error code validation_error, details list of field message } when a required field is missing, a field has wrong type, detected_at is not ISO8601, chain is empty, or tx_hash does not match the expected hex pattern
- POST /signals and POST /cases return HTTP 400 with body { error_code malformed_json, message } when the request body is not parseable JSON; HTTP 400 is reused with the distinct error_code to keep client-side handling uniform across parse and validation failures
- All protected endpoints return HTTP 401 with body { error_code missing_token } when the Authorization header is absent, and HTTP 403 with body { error_code invalid_token } when the Bearer token does not match HELIOS_API_TOKEN
- GET /cases/{case_id} and POST /cases/{case_id}/retry-handoff return HTTP 404 with body { error_code case_not_found, case_id } when no case row exists for the path id
- POST /cases/{case_id}/retry-handoff returns HTTP 409 with body { error_code handoff_not_retryable, state, handoff_status } when the case is not in (state=done AND handoff_status=failed)
- GET /cases returns HTTP 400 with body { error_code invalid_pagination, details } when limit is greater than 500, when limit or offset is negative, or when limit or offset is not an integer
- Dedup lookup for the dedup key (chain, tx_hash) returns the latest lineage leaf; if the leaf state is queued, running, done, or handed-off, no new row is inserted and status=existing is returned; if the leaf state is failed, a new linked case row is inserted with status=rerun_created; if no leaf exists, a new root case is inserted with status=new
- Active manual case with force_rerun=true creates a new case row linked by parent_case_id with status=rerun_created without aborting the predecessor lumoskit attempt
- Worker dispatches queued cases in FIFO order by created_at ASC with at most max_concurrent_lumoskit concurrent child processes (default 2)
- Each running case spawns bin/lumoskit with --tx, --chain, and a unique --output-root derived from case_id, with all RPC-related env vars passed through unchanged
- After lumoskit exits, helios reads summary.json under output_root and applies outcome mapping rules O5, O6, O7, O4, O1, O2, O3, O8 from constraints in that strict order; the first matching rule sets state, outcome, and failure_kind
- verified, partial, and unverified cases are delivered to every URL in HELIOS_DOWNSTREAM_WEBHOOK_URLS and case handoff_status is aggregated per the constraint defining succeeded, retrying, failed, and skipped
- engine_error cases skip downstream fan-out, set handoff_status=skipped, and produce operator notification only
- Each handoff attempt is recorded as a handoff_attempts row with attempt_id, case_id, target_url, attempted_at, http_status, result, attempt_index_for_target, and error; failures are retried with exponential backoff bounded by HELIOS_HANDOFF_RETRY_MAX_ATTEMPTS, HELIOS_HANDOFF_RETRY_BACKOFF_BASE_SECONDS, and HELIOS_HANDOFF_RETRY_BACKOFF_MAX_SECONDS
- After handoff retry exhaustion on any URL the case stays at state=done with handoff_status=failed
- Successful handoff transitions state from done to handed-off with handoff_status=succeeded
- POST /cases/{case_id}/retry-handoff retries downstream handoff for a case in state=done with handoff_status=failed without rerunning lumoskit; it returns HTTP 202 on accepted retry
- GET /cases supports filters by state, outcome, chain, tx_hash, and created_at range, with offset and limit pagination; default limit 50, maximum limit 500, default ordering created_at DESC; response body matches case_list_response schema
- GET /cases/{case_id} returns the case-detail entity defined by ontology_schema, including case_events, handoff_attempts, notification_attempts, handoff_status, notification_status, and summary_json_path
- Notifications are sent for the events verified, partial, unverified, engine_error, and handoff_failed through every configured notification channel
- Each notification attempt is recorded as a notification_attempts row with attempt_id, case_id, channel, event, attempted_at, result, attempt_index, and error; failures are retried with exponential backoff bounded by HELIOS_NOTIFY_RETRY_MAX_ATTEMPTS, HELIOS_NOTIFY_RETRY_BACKOFF_BASE_SECONDS, and HELIOS_NOTIFY_RETRY_BACKOFF_MAX_SECONDS; failures never change case state
- On startup, every case found in state=running is updated to state=failed, outcome=engine_error, failure_kind=host_restart, and a new linked case is inserted as state=queued with attempt_number incremented and a fresh output_root
- Every state transition appends a case_events row in the same SQLite transaction as the case state update
- /healthz endpoint returns HTTP 200 with JSON body { status ok } and requires no authentication
- /metrics exposes Prometheus metrics including helios_case_state_total, helios_case_outcome_total, helios_queue_depth, helios_lumoskit_duration_seconds, helios_handoff_attempt_total, and helios_notification_attempt_total; the metric labels and value semantics are documented under the runtime_config_surface section of the ontology
- Structured JSON logs include level, ts, case_id, state, outcome, and event fields
ontology_schema:
  name: HeliosV1Surfaces
  description: Schemas for the persisted case-detail entity (the primary helios v1 record) plus the non-persisted API/config surfaces it touches. The persisted case-detail fields appear first (each having required true or false at the column level); the later object-typed entries (submission_request, submission_response, case_list_response, runtime_config_surface) are explicitly non-persisted reference schemas describing the request/response/config shapes used by acceptance_criteria. Lineage follows the case-per-attempt model; each retry, automatic engine_error recovery, or force_rerun is a new case row linked via parent_case_id and there is no nested attempts sub-collection.
  fields:
  - {name: case_id, type: string, required: true, description: Stable identifier for a helios case row (persisted)}
  - {name: chain, type: string, required: true, description: Blockchain network label for the transaction (persisted)}
  - {name: tx_hash, type: string, required: true, description: Suspicious transaction hash (persisted)}
  - {name: source, type: string, required: false, description: "Ingress source label such as hack-detector or operator; null when not provided by the submitter (persisted)"}
  - {name: detected_at, type: string, required: false, description: "Detection timestamp supplied by the submitter (ISO8601); null when not provided (persisted)"}
  - {name: metadata, type: object, required: false, description: "Arbitrary submitter-supplied metadata retained for audit; defaults to empty object (persisted)"}
  - {name: state, type: string, required: true, description: "Operational state; enum of queued, running, done, handed-off, failed (persisted)"}
  - {name: outcome, type: string, required: false, description: "Lumoskit-derived classification; enum of verified, partial, unverified, engine_error; null while the case has not yet reached state=done or state=failed (persisted)"}
  - {name: failure_kind, type: string, required: false, description: "Failure category populated when outcome=engine_error; enum of summary_missing, summary_unreadable, host_restart, lumoskit_nonzero_exit, lumoskit_reported_engine_error, lumoskit_unexpected_summary_shape; null otherwise (persisted)"}
  - {name: output_root, type: string, required: false, description: "Filesystem root assigned for this case_id lumoskit attempt; null until the worker assigns one (persisted)"}
  - {name: summary_json_path, type: string, required: false, description: "Expected path to lumoskit summary.json under output_root, computed as soon as output_root is assigned; the value is kept populated even when summary.json is missing or unparseable so operators can locate the expected artifact for diagnosis; null only until output_root is assigned (persisted)"}
  - {name: attempt_number, type: number, required: true, description: "Position of this case in its lineage chain (1 for root, +1 per linked retry) (persisted)"}
  - {name: parent_case_id, type: string, required: false, description: "case_id of the predecessor in the lineage chain; null for root cases (attempt_number=1) (persisted)"}
  - {name: force_rerun, type: boolean, required: false, description: "True when this case was created by a manual submit with force_rerun=true; defaults to false otherwise (persisted)"}
  - {name: handoff_status, type: string, required: true, description: "Downstream delivery status; enum of pending, retrying, succeeded, failed, skipped (skipped used for engine_error AND for an empty HELIOS_DOWNSTREAM_WEBHOOK_URLS list) (persisted)"}
  - {name: notification_status, type: string, required: true, description: "Operator notification status; enum of pending, retrying, succeeded, failed, disabled (disabled used when no notification channel is configured) (persisted)"}
  - {name: created_at, type: string, required: true, description: "Case creation timestamp UTC ISO8601 (persisted)"}
  - {name: updated_at, type: string, required: true, description: "Last case mutation timestamp UTC ISO8601 (persisted)"}
  - name: case_events
    type: array
    required: true
    description: 'Append-only state transition and audit events for this case (persisted). Each item is an object with the following required fields: event_id (string, unique), case_id (string, foreign key), from_state (string, nullable enum of queued, running, done, handed-off, failed; null only for the initial case_inserted event), to_state (string, required enum of queued, running, done, handed-off, failed for state-transition events; null for non-transition events such as handoff_attempted or notification_attempted), event_type (string, enum of case_inserted, state_transition, handoff_attempted, notification_attempted, restart_recovery), payload (object, optional), occurred_at (string, UTC ISO8601). Items are inserted in the same SQLite transaction as the corresponding state mutation.'
  - name: handoff_attempts
    type: array
    required: true
    description: 'Per-attempt records of downstream webhook delivery (persisted). Each item is an object with the following required fields: attempt_id (string, unique), case_id (string), target_url (string, one of the URLs in HELIOS_DOWNSTREAM_WEBHOOK_URLS), attempted_at (string, UTC ISO8601), http_status (number, nullable when transport failed before a response), result (string, enum of success, retryable_failure, permanent_failure), error (string, nullable), attempt_index_for_target (number, 1-based index within the per-URL retry budget).'
  - name: notification_attempts
    type: array
    required: true
    description: 'Per-attempt records of operator notification delivery (persisted). Each item is an object with the following required fields: attempt_id (string, unique), case_id (string), channel (string, enum of webhook, telegram), event (string, enum of verified, partial, unverified, engine_error, handoff_failed), attempted_at (string, UTC ISO8601), result (string, enum of success, retryable_failure, permanent_failure, channel_disabled), error (string, nullable), attempt_index (number, 1-based index within the retry budget).'
  - name: submission_request
    type: object
    required: false
    description: 'Non-persisted reference schema for the POST /signals and POST /cases request body. Fields: chain (required string), tx_hash (required string), source (optional string, used by /signals only), detected_at (optional ISO8601 string, used by /signals only), force_rerun (optional boolean default false, used by /cases only), metadata (optional object).'
  - name: submission_response
    type: object
    required: false
    description: 'Non-persisted reference schema for the 202 Accepted response from POST /signals and POST /cases. Fields: case_id (required string), status (required enum of new, existing, rerun_created), parent_case_id (nullable string, set when status is rerun_created).'
  - name: case_list_response
    type: object
    required: false
    description: 'Non-persisted reference schema for the GET /cases response body. Fields: items (array of CaseSummary objects, where CaseSummary is the persisted case-detail fields EXCLUDING case_events, handoff_attempts, notification_attempts to keep list payloads light), total (number, total matching rows after filters), limit (number, echoed pagination limit), offset (number, echoed pagination offset), order (string, constant value of created_at DESC for v1).'
  - name: runtime_config_surface
    type: object
    required: false
    description: 'Non-persisted reference schema for env vars consumed at process startup. Fields: HELIOS_API_TOKEN (required string, Bearer token), HELIOS_DB_PATH (required string), HELIOS_OUTPUT_ROOT (required string, parent directory under which per-case output_root is created), HELIOS_MAX_CONCURRENT_LUMOSKIT (optional integer default 2), HELIOS_DOWNSTREAM_WEBHOOK_URLS (optional comma-separated string), OPERATOR_NOTIFY_WEBHOOK_URL (optional string), TELEGRAM_BOT_TOKEN (optional string), TELEGRAM_CHAT_ID (optional string), HELIOS_HANDOFF_RETRY_MAX_ATTEMPTS (optional integer default 5), HELIOS_HANDOFF_RETRY_BACKOFF_BASE_SECONDS (optional integer default 2), HELIOS_HANDOFF_RETRY_BACKOFF_MAX_SECONDS (optional integer default 300), HELIOS_NOTIFY_RETRY_MAX_ATTEMPTS (optional integer default 5), HELIOS_NOTIFY_RETRY_BACKOFF_BASE_SECONDS (optional integer default 2), HELIOS_NOTIFY_RETRY_BACKOFF_MAX_SECONDS (optional integer default 300), plus any RPC env vars passed through unchanged to lumoskit (CEFG_LIVE_RPC_URL, RPC_URL, ETH_RPC_URL, ALCHEMY_API_KEY).'
evaluation_principles:
- {name: BoundaryAdherence, weight: 0.20, description: Keeps detection in hack-detector and trace acquisition, localization, lifting, PoC synthesis, and agent_poc gate in lumoskit while helios only orchestrates}
- {name: OperationalSimplicity, weight: 0.18, description: Minimizes small-team operational burden through single process, SQLite, Docker volume, direct webhooks, and no external broker}
- {name: DurabilityAndRecovery, weight: 0.18, description: Persists cases, events, handoff attempts, and notification attempts and recovers running work after restart with new linked cases and fresh output roots}
- {name: IdempotencyCorrectness, weight: 0.14, description: Applies deterministic dedup based on the latest lineage leaf, parent_case_id chaining, and force_rerun behavior for repeated (chain, tx_hash) submissions without wasting lumoskit resources}
- {name: OperatorActionability, weight: 0.14, description: Surfaces state, outcome, failure_kind, search APIs, retry-handoff, and notifications so operators know whether to rerun, inspect, or resend}
- {name: Observability, weight: 0.10, description: Provides structured logs, Prometheus metrics, health checks, and SQLite audit trails sufficient for v1 operations}
- {name: ImplementationFocus, weight: 0.06, description: Delivers a first implementable surface without dashboard, advanced search, native chat integrations beyond Telegram, distributed tracing, or multi-instance complexity}
exit_conditions:
- name: SeedReady
  description: Specification captures all first-interview decisions needed to begin implementation
  criteria: goal, constraints, API surface (including error paths and pagination response schema), state store, runtime, deployment, state machine, queue, retry, dedup, fan-out, notifications, observability, and out-of-scope boundaries are explicit
- name: BoundaryPreserved
  description: helios responsibilities remain separated from sibling repositories
  criteria: no detection logic and no lumoskit internal engine responsibilities are assigned to helios
- name: ImplementableV1
  description: Scope is small enough for greenfield coding to start
  criteria: all required endpoints, tables, state transitions, config env vars, and verification expectations are concrete
- name: NoOpenCoreChoices
  description: No unresolved v1 architecture decision remains
  criteria: language, store, ingress, fan-out, deployment, state-machine strategy, observability, concurrency, retry, notifications, lineage model, outcome mapping precedence, multi-URL aggregation, dedup lookup, HTTP error paths, GET /cases response shape, and failure taxonomy are fixed
