global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    service: helios

scrape_configs:
  - job_name: helios
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ['__HELIOS_HOST__']
        labels:
          instance: helios-local
