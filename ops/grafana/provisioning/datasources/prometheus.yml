apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # Both Prometheus and Grafana run with network_mode: host, so the loopback
    # address reaches the local Prometheus directly. macOS / Windows users
    # who switch to bridge networking should change this to
    # http://prometheus:9090.
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
